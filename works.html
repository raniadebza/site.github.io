            Une <section class="year"> par année, la plus récente en premier.
            Pour ajouter une œuvre : copier un bloc <li class="artwork"> … </li>

            Le compteur et les flèches se règlent tout seuls.
            Pour ajouter une année : copier une section entière, changer data-year,
            puis ajouter le lien correspondant dans le menu des quatre pages.
        -->
